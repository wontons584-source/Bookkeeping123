<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>大学生生活费记账分析系统</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <h1>大学生生活费记账分析系统</h1>
    <p class="site-sub">注册登录后使用 · 学生记账分析 / 家长只读总览 · 数据只存本机浏览器，零网络请求</p>
  </header>

  <!-- 主容器：app.js 按登录态与角色整体渲染（登录注册 / 学生界面 / 家长引导页 / 家长只读视图）。
       家长视图通过"不渲染"保证 DOM 中无任何写入口，而非 display:none 隐藏。 -->
  <main id="app-main"></main>

  <footer class="site-footer">
    <p>life-ledger · 双击 index.html 即可使用 · 数据存于浏览器 localStorage / sessionStorage</p>
  </footer>

  <!-- 经典 script 按依赖顺序引入（file:// 直开，禁止 ES modules）：
       Chart.js → stats（统计纯函数）→ store（唯一存储访问）→ speech（语音）
       → auth（注册登录/哈希/邀请码/迁移决策）→ recommend（智能推荐）
       → insights（AI 洞察，依赖 stats）→ app（渲染入口） -->
  <script src="lib/chart.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/store.js"></script>
  <script src="js/speech.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/recommend.js"></script>
  <script src="js/insights.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
